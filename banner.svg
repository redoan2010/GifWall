<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset="0.5" stop-color="#ffb347"/><stop offset="1" stop-color="#3ee6c4"/></linearGradient>
<clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
<style>
.bg{fill:#0f1020}
.title{font:900 84px 'Segoe UI',Arial,sans-serif;fill:url(#g);letter-spacing:4px}
.sub{font:500 22px 'Segoe UI',Arial,sans-serif;fill:#c9cbe6}
.frame{fill:#1c1e3a;stroke:#2f3260;stroke-width:2}
.strip{animation:slide 14s linear infinite}
.strip2{animation:slide2 18s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-300px)}}
@keyframes slide2{from{transform:translateX(-300px)}to{transform:translateX(0)}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:450px 118px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.t1{animation:fade 6s infinite}
.t2{animation:fade 6s infinite 2s}
.t3{animation:fade 6s infinite 4s}
@keyframes fade{0%{opacity:0}6%{opacity:1}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t2,.t3{opacity:0}.t1{opacity:1}}
</style>
</defs>
<g clip-path="url(#c)">
<rect class="bg" width="900" height="260"/>
<g class="strip" opacity=".55"><g id="s">
<rect class="frame" x="0" y="14" width="90" height="56" rx="8"/><rect class="frame" x="100" y="14" width="90" height="56" rx="8"/><rect class="frame" x="200" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="300" y="14" width="90" height="56" rx="8"/><rect class="frame" x="400" y="14" width="90" height="56" rx="8"/><rect class="frame" x="500" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="600" y="14" width="90" height="56" rx="8"/><rect class="frame" x="700" y="14" width="90" height="56" rx="8"/><rect class="frame" x="800" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="900" y="14" width="90" height="56" rx="8"/><rect class="frame" x="1000" y="14" width="90" height="56" rx="8"/><rect class="frame" x="1100" y="14" width="90" height="56" rx="8"/>
</g></g>
<g class="strip2" opacity=".55" transform="translate(0,176)">
<rect class="frame" x="0" y="14" width="90" height="56" rx="8"/><rect class="frame" x="100" y="14" width="90" height="56" rx="8"/><rect class="frame" x="200" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="300" y="14" width="90" height="56" rx="8"/><rect class="frame" x="400" y="14" width="90" height="56" rx="8"/><rect class="frame" x="500" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="600" y="14" width="90" height="56" rx="8"/><rect class="frame" x="700" y="14" width="90" height="56" rx="8"/><rect class="frame" x="800" y="14" width="90" height="56" rx="8"/>
<rect class="frame" x="900" y="14" width="90" height="56" rx="8"/><rect class="frame" x="1000" y="14" width="90" height="56" rx="8"/><rect class="frame" x="1100" y="14" width="90" height="56" rx="8"/>
</g>
<g class="pulse"><text class="title" x="450" y="140" text-anchor="middle">GIF//WALL</text></g>
<g text-anchor="middle">
<text class="sub t1" x="450" y="186">Your desktop, alive.</text>
<text class="sub t2" x="450" y="186">No extra app. Just the GIFs you love.</text>
<text class="sub t3" x="450" y="186">Tiny on CPU. Tiny on RAM.</text>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<style>
.bg{fill:#0f1020}
.card{fill:#171934;stroke:#2f3260;stroke-width:2}
.big{font:900 40px 'Segoe UI',Arial,sans-serif;fill:#fff}
.small{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#b9bce0}
.c1{animation:rise 3s ease-in-out infinite}
.c2{animation:rise 3s ease-in-out infinite .4s}
.c3{animation:rise 3s ease-in-out infinite .8s}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect class="bg" width="900" height="190" rx="18"/>
<g class="c1"><rect class="card" x="24" y="30" width="270" height="130" rx="14"/>
<text class="big" x="44" y="82">0 extras</text><text class="small" x="44" y="112">Standalone app. No other</text><text class="small" x="44" y="134">wallpaper software needed.</text></g>
<g class="c2"><rect class="card" x="315" y="30" width="270" height="130" rx="14"/>
<text class="big" x="335" y="82">Low CPU</text><text class="small" x="335" y="112">Barely a blip in Task</text><text class="small" x="335" y="134">Manager while it plays.</text>
</g>
<g class="c3"><rect class="card" x="606" y="30" width="270" height="130" rx="14"/>
<text class="big" x="626" y="82">Low RAM</text><text class="small" x="626" y="112">Light memory footprint,</text><text class="small" x="626" y="134">even for long sessions.</text>
</g>
</svg>
